<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Pemilihan Ketua PC IAI Grobogan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #0f7a42 0%,
          #16a05d 45%,
          #eaf8f0 100%
        );

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .app-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: #ffffff;

      border-radius: 24px;

      padding: 32px 28px;

      box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.18);

      position: relative;

      overflow: hidden;
    }

    .top-line {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;

      height: 6px;

      background: #087f3e;
    }

    .logo-wrapper {
      width: 90px;
      height: 90px;

      margin: 10px auto 18px;

      border-radius: 50%;

      background: #f0faf4;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 3px solid #d8f0e1;
    }

    .logo-placeholder {
      font-size: 24px;
      font-weight: 800;
      color: #087f3e;
      text-align: center;
    }

    .title {
      text-align: center;

      font-size: 22px;

      font-weight: 800;

      color: #153b2a;

      line-height: 1.3;
    }

    .subtitle {
      text-align: center;

      margin-top: 8px;

      color: #66756d;

      font-size: 14px;

      line-height: 1.5;
    }

    .form {
      margin-top: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;

      margin-bottom: 8px;

      color: #26382f;

      font-size: 14px;

      font-weight: 700;
    }

    input {
      width: 100%;

      height: 52px;

      border: 1px solid #d7e2dc;

      border-radius: 12px;

      padding: 0 15px;

      font-size: 16px;

      outline: none;

      background: #fbfdfc;

      transition: 0.2s;
    }

    input:focus {
      border-color: #16a05d;

      box-shadow:
        0 0 0 3px rgba(22, 160, 93, 0.12);

      background: #ffffff;
    }

    .pin-wrapper {
      position: relative;
    }

    .pin-wrapper input {
      padding-right: 60px;
    }

    .toggle-pin {
      position: absolute;

      right: 10px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      cursor: pointer;

      color: #087f3e;

      font-size: 13px;

      font-weight: 700;
    }

    .login-button {
      width: 100%;

      height: 54px;

      border: none;

      border-radius: 13px;

      background: #087f3e;

      color: white;

      font-size: 16px;

      font-weight: 800;

      cursor: pointer;

      transition: 0.2s;

      margin-top: 5px;
    }

    .login-button:hover {
      background: #066a34;
    }

    .login-button:disabled {
      opacity: 0.65;

      cursor: not-allowed;
    }

    .loading {
      display: none;

      align-items: center;

      justify-content: center;

      gap: 8px;

      margin-top: 15px;

      color: #087f3e;

      font-size: 13px;
    }

    .spinner {
      width: 16px;
      height: 16px;

      border: 2px solid #d4eadc;

      border-top-color: #087f3e;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .message {
      display: none;

      margin-top: 16px;

      padding: 13px 14px;

      border-radius: 10px;

      font-size: 13px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: #fff1f1;

      color: #b42318;

      border: 1px solid #ffd4d4;
    }

    .message.success {
      display: block;

      background: #eefbf3;

      color: #087f3e;

      border: 1px solid #ccefd9;
    }

    .footer {
      text-align: center;

      margin-top: 22px;

      color: #84928b;

      font-size: 11px;

      line-height: 1.5;
    }

    @media (max-width: 480px) {

      body {
        padding: 12px;
      }

      .login-card {
        padding: 28px 20px;
        border-radius: 20px;
      }

      .title {
        font-size: 20px;
      }
    }
  </style>
</head>

<body>

  <div class="app-container">

    <div class="login-card">

      <div class="top-line"></div>

      <div class="logo-wrapper">
        <div class="logo-placeholder">
          IAI
        </div>
      </div>

      <h1 class="title">
        PEMILIHAN KETUA
        <br>
        PC IAI GROBOGAN
      </h1>

      <p class="subtitle">
        Silakan masukkan ID Pemilih dan PIN
        untuk mengikuti proses pemilihan.
      </p>

      <form
        id="loginForm"
        class="form"
      >

        <div class="form-group">

          <label for="idPemilih">
            ID PEMILIH
          </label>

          <input
            type="text"
            id="idPemilih"
            name="idPemilih"
            placeholder="Contoh: P00002"
            autocomplete="username"
            autocapitalize="characters"
            required
          >

        </div>


        <div class="form-group">

          <label for="pin">
            PIN
          </label>

          <div class="pin-wrapper">

            <input
              type="password"
              id="pin"
              name="pin"
              placeholder="Masukkan PIN"
              inputmode="numeric"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="toggle-pin"
              id="togglePin"
            >
              Tampilkan
            </button>

          </div>

        </div>


        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          MASUK
        </button>


        <div
          class="loading"
          id="loading"
        >
          <div class="spinner"></div>
          <span>Memverifikasi...</span>
        </div>


        <div
          id="message"
          class="message"
        ></div>

      </form>


      <div class="footer">

        Sistem Pemilihan Ketua
        <br>

        PC IAI Grobogan

      </div>

    </div>

  </div>


<script>

  /* =====================================================
   * KONFIGURASI API
   * ===================================================== */

  const API_URL =
    'https://script.google.com/macros/s/AKfycbw8hsSy0CZ8OnxLW_KpwuHOIpTTcQh94ZD2CqXFOv3l3GlEjckszIm9LGkEVd-oTRlK/exec';


  /* =====================================================
   * ELEMENT
   * ===================================================== */

  const loginForm =
    document.getElementById('loginForm');

  const idPemilihInput =
    document.getElementById('idPemilih');

  const pinInput =
    document.getElementById('pin');

  const loginButton =
    document.getElementById('loginButton');

  const togglePin =
    document.getElementById('togglePin');

  const loading =
    document.getElementById('loading');

  const message =
    document.getElementById('message');


  /* =====================================================
   * TAMPILKAN / SEMBUNYIKAN PIN
   * ===================================================== */

  togglePin.addEventListener(
    'click',
    function () {

      if (pinInput.type === 'password') {

        pinInput.type = 'text';

        togglePin.textContent =
          'Sembunyikan';

      } else {

        pinInput.type = 'password';

        togglePin.textContent =
          'Tampilkan';

      }

    }
  );


  /* =====================================================
   * MESSAGE
   * ===================================================== */

  function showMessage(
    text,
    type = 'error'
  ) {

    message.textContent = text;

    message.className =
      'message ' + type;

  }


  function hideMessage() {

    message.textContent = '';

    message.className =
      'message';

  }


  /* =====================================================
   * LOADING
   * ===================================================== */

  function setLoading(
    state
  ) {

    loginButton.disabled =
      state;

    loading.style.display =
      state
        ? 'flex'
        : 'none';

    loginButton.textContent =
      state
        ? 'MEMPROSES...'
        : 'MASUK';

  }


  /* =====================================================
   * API REQUEST
   * ===================================================== */

  async function apiRequest(
    payload
  ) {

    const response =
      await fetch(
        API_URL,
        {
          method: 'POST',

          headers: {
            'Content-Type':
              'text/plain;charset=utf-8'
          },

          body:
            JSON.stringify(payload)
        }
      );


    if (!response.ok) {

      throw new Error(
        'Server mengembalikan HTTP ' +
        response.status
      );

    }


    const result =
      await response.json();


    return result;

  }


  /* =====================================================
   * LOGIN
   * ===================================================== */

  loginForm.addEventListener(
    'submit',
    async function (event) {

      event.preventDefault();

      hideMessage();

      const idPemilih =
        idPemilihInput
          .value
          .trim()
          .toUpperCase();

      const pin =
        pinInput
          .value
          .trim();


      if (!idPemilih) {

        showMessage(
          'ID Pemilih wajib diisi.'
        );

        idPemilihInput.focus();

        return;

      }


      if (!pin) {

        showMessage(
          'PIN wajib diisi.'
        );

        pinInput.focus();

        return;

      }


      setLoading(true);


      try {

        const result =
          await apiRequest({

            action:
              'login',

            idPemilih:
              idPemilih,

            pin:
              pin

          });


        console.log(
          'RESPON LOGIN:',
          result
        );


        if (!result.success) {

          showMessage(
            result.message ||
            'Login gagal.'
          );

          return;

        }


        /*
         * LOGIN BERHASIL
         *
         * Token disimpan untuk
         * proses berikutnya.
         */

        sessionStorage.setItem(
          'vote_token',
          result.token
        );


        sessionStorage.setItem(
          'vote_id_pemilih',
          result.idPemilih
        );


        sessionStorage.setItem(
          'vote_nama',
          result.nama
        );


        showMessage(
          'Login berhasil. Selamat datang, ' +
          result.nama + '.',
          'success'
        );


        /*
         * Untuk tahap ini kita
         * belum pindah halaman.
         *
         * Setelah login terbukti berhasil,
         * tahap berikutnya akan diarahkan
         * ke halaman kandidat.
         */

        console.log(
          'TOKEN:',
          result.token
        );


      } catch (error) {

        console.error(
          'LOGIN ERROR:',
          error
        );


        showMessage(
          'Tidak dapat terhubung ke server. ' +
          'Periksa koneksi internet atau URL API.'
        );


      } finally {

        setLoading(false);

      }

    }
  );


  /* =====================================================
   * INITIAL CHECK
   * ===================================================== */

  console.log(
    'Frontend Pemilihan aktif.'
  );

  console.log(
    'API:',
    API_URL
  );

</script>

</body>
</html>
